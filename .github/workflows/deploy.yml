name: Stock Dashboard Auto-Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'full_pipeline'
        type: choice
        options:
          - full_pipeline
          - single_stock
      symbol:
        description: 'Stock symbol (only for single_stock mode, e.g., RELIANCE.NS)'
        required: false
        default: ''
        type: string
      provider:
        description: 'LLM provider'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - openai
          - anthropic
          - claude_code

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-pipeline:
    name: Build Stock Dashboard
    runs-on: ubuntu-latest
    if: github.event.inputs.mode != 'single_stock'

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONFIDENCE_THRESHOLD: ${{ secrets.CONFIDENCE_THRESHOLD || '7' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flask pandas numpy yfinance gspread google-auth openpyxl requests

      - name: Run Stock Agent Pipeline
        run: |
          echo "Starting Stock Dashboard Pipeline..."
          python app.py --cli --mode live --source excel --provider ${{ secrets.LLM_PROVIDER || 'openai' }}
          echo "Pipeline completed!"
        continue-on-error: true

      - name: Build static site
        run: |
          echo "Building static site..."
          mkdir -p _site

          # Copy the search-enabled dashboard
          cp index.html _site/index.html

          # Copy output.json if it exists (from pipeline run)
          if [ -f output.json ]; then
            cp output.json _site/output.json
            echo "Copied output.json"
          else
            echo "output.json not found - pipeline may have failed"
            # Create empty output.json so the dashboard loads
            echo '{"timestamp":"'$(date -Iseconds)'","engine":"-","kpi":{"universe":0,"in_debate":0,"buy_signals":0,"top_pick":"-","top_pick_confidence":0},"verdicts":[],"total_verdicts":0}' > _site/output.json
          fi

          # List what we're deploying
          echo "Files in _site:"
          ls -la _site/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-dashboard-output
          path: |
            output.json
            excel_final_list.xlsx
            excel_universe.json
            audit.db
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pipeline:
    name: Deploy to GitHub Pages
    needs: build-pipeline
    runs-on: ubuntu-latest
    if: github.event.inputs.mode != 'single_stock'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  analyze-single-stock:
    name: Analyze ${{ github.event.inputs.symbol }}
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'single_stock'

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ github.event.inputs.provider == 'auto' && secrets.LLM_PROVIDER || github.event.inputs.provider }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy yfinance openpyxl requests

      - name: Analyze stock
        run: |
          echo "Analyzing ${{ github.event.inputs.symbol }}..."
          python single_stock.py "${{ github.event.inputs.symbol }}" --provider ${{ github.event.inputs.provider == 'auto' && 'openai' || github.event.inputs.provider }} --save

      - name: Upload analysis result
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-${{ github.event.inputs.symbol }}
          path: analysis_*.json
          retention-days: 30
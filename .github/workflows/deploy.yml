name: Stock Dashboard Auto-Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'full_pipeline'
        type: choice
        options:
          - full_pipeline
          - single_stock
      symbol:
        description: 'Stock symbol (only for single_stock mode, e.g., RELIANCE.NS)'
        required: false
        default: ''
        type: string
      provider:
        description: 'LLM provider'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - openai
          - anthropic
          - claude_code

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Full Pipeline (default)
  # ─────────────────────────────────────────────
  build-pipeline:
    name: Build Stock Dashboard
    runs-on: ubuntu-latest
    if: github.event.inputs.mode != 'single_stock'

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONFIDENCE_THRESHOLD: ${{ secrets.CONFIDENCE_THRESHOLD || '7' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flask pandas numpy yfinance gspread google-auth openpyxl requests

      - name: Run Stock Agent Pipeline
        run: |
          echo "Starting Stock Dashboard Pipeline..."
          python app.py --cli --mode live --source excel --provider ${{ secrets.LLM_PROVIDER || 'openai' }}
          echo "Pipeline completed!"

      - name: Generate static dashboard
        run: |
          echo "Building static dashboard..."
          python build_static_dashboard.py
          echo "Static dashboard built!"

      - name: Copy search-enabled dashboard
        run: |
          # Copy the search-enabled index.html to _site
          cp index.html _site/index.html
          # Also copy output.json for pipeline data display
          cp output.json _site/output.json 2>/dev/null || true
          echo "Search-enabled dashboard ready!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-dashboard-output
          path: |
            output.json
            excel_final_list.xlsx
            excel_universe.json
            audit.db
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pipeline:
    name: Deploy to GitHub Pages
    needs: build-pipeline
    runs-on: ubuntu-latest
    if: github.event.inputs.mode != 'single_stock'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────
  # JOB 2: Single Stock Analysis (GitHub Actions)
  # ─────────────────────────────────────────────
  analyze-single-stock:
    name: Analyze ${{ github.event.inputs.symbol }}
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'single_stock'

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ github.event.inputs.provider == 'auto' && secrets.LLM_PROVIDER || github.event.inputs.provider }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy yfinance openpyxl requests

      - name: Analyze stock
        run: |
          echo "Analyzing ${{ github.event.inputs.symbol }}..."
          python single_stock.py "${{ github.event.inputs.symbol }}" --provider ${{ github.event.inputs.provider == 'auto' && 'openai' || github.event.inputs.provider }} --save

      - name: Upload analysis result
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-${{ github.event.inputs.symbol }}
          path: analysis_*.json
          retention-days: 30
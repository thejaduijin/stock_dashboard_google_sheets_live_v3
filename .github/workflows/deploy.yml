name: 🚀 Stock Dashboard Auto-Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI
  schedule:
    # Run every weekday at 9:30 AM and 3:30 PM IST (market open & close)
    # IST = UTC+5:30, so 9:30 IST = 4:00 UTC, 15:30 IST = 10:00 UTC
    - cron: "0 4,10 * * 1-5"

jobs:
  build-and-deploy:
    name: Build & Deploy Stock Dashboard
    runs-on: ubuntu-latest

    env:
      # These are injected from GitHub Secrets
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONFIDENCE_THRESHOLD: ${{ secrets.CONFIDENCE_THRESHOLD || '7' }}

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout the repository
      # ─────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Set up Python environment
      # ─────────────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ─────────────────────────────────────────────
      # 3. Install dependencies
      # ─────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Fallback: install common packages if requirements.txt is missing
          pip install flask pandas numpy yfinance gspread google-auth openpyxl requests

      # ─────────────────────────────────────────────
      # 4. Run tests (optional but recommended)
      # ─────────────────────────────────────────────
      - name: 🧪 Run tests
        run: |
          if [ -f test_*.py ] || [ -f *_test.py ]; then
            python -m pytest --tb=short
          else
            echo "No tests found, skipping..."
          fi
        continue-on-error: true

      # ─────────────────────────────────────────────
      # 5. Execute the Stock Agent (CLI mode)
      # ─────────────────────────────────────────────
      - name: ▶️ Run Stock Agent Pipeline
        run: |
          echo "🚀 Starting Stock Dashboard Pipeline..."
          python app.py --cli --mode live --source excel --provider ${{ secrets.LLM_PROVIDER || 'openai' }}
          echo "✅ Pipeline completed!"

      # ─────────────────────────────────────────────
      # 6. Upload generated artifacts
      # ─────────────────────────────────────────────
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-dashboard-output
          path: |
            output.json
            excel_final_list.xlsx
            excel_universe.json
            dashboard.html
            audit.db
          retention-days: 30

      # ─────────────────────────────────────────────
      # 7. Deploy dashboard.html to GitHub Pages
      # ─────────────────────────────────────────────
      - name: 🌐 Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: '.github,__pycache__,*.py,*.db,*.json,*.xlsx,*.md,audit.db,output.json,excel_universe.json'